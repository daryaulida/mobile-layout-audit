<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clean mobile page</title>
  <style>
    body { margin: 0; padding: 16px; font: 16px/1.5 sans-serif; }
    img { max-width: 100%; height: auto; display: block; }
    .btn { display: block; padding: 14px; text-align: center; background: #111; color: #fff; }
  </style>
</head>
<body>
  <h1>Everything fits</h1>
  <p>Readable text with an <a href="#a">inline link</a>.</p>
  <img alt="square" width="100" height="100" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100' height='100' fill='teal'/></svg>">
  <a class="btn" href="#contact">Contact us</a>
</body>
</html>
