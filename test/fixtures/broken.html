<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Broken mobile page</title>
  <style>
    body { margin: 0; font: 16px sans-serif; }
    .wide { width: 600px; height: 40px; background: #f99; }
    .tiny { font-size: 9px; }
    .icon-btn { display: inline-block; width: 16px; height: 16px; }
    .slider { overflow: hidden; width: 100%; }
    .slider .track { width: 1200px; height: 20px; }
    .squashed { width: 300px; height: 50px; }
  </style>
</head>
<body>
  <div class="wide" id="wide">Too wide block</div>
  <p class="tiny">Fine print nobody can read</p>
  <a class="icon-btn" href="#x" aria-label="close">x</a>
  <p>Inline <a href="#ok">links in text</a> are fine.</p>
  <div class="slider"><div class="track">Slider track is clipped, so it is OK</div></div>
  <img class="squashed" alt="logo" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect width='100' height='100' fill='teal'/></svg>">
</body>
</html>
